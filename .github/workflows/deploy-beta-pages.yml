name: Deploy Beta Pages Preview

on:
  push:
    branches:
      - projection-edge-case-harness
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          ref: projection-edge-case-harness
          path: beta

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            beta/package-lock.json

      - name: Install main dependencies
        working-directory: main
        run: npm ci

      - name: Build main
        working-directory: main
        run: npm run build

      - name: Install beta dependencies
        working-directory: beta
        run: npm ci

      - name: Test beta
        working-directory: beta
        run: npm run test

      - name: Build beta
        working-directory: beta
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/beta
          cp -R main/dist/. site/
          cp -R beta/dist/. site/beta/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
